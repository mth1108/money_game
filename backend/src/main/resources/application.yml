spring:
  application:
    name: moneygame
  config:
    # API 키와 DB 접속 정보. .gitignore 대상이라 없을 수도 있다.
    #   toss.api.client-id / client-secret
    #   spring.datasource.url / username / password
    #     url 에 rewriteBatchedStatements=true 를 넣어야 배치 insert 가 실제로 묶여 나간다
    import: optional:classpath:application-local.yml
  main:
    banner-mode: off
  jpa:
    hibernate:
      # update 금지 (CLAUDE.md §5). DDL 원본은 db/schema.sql 이고 손으로 적용한다
      ddl-auto: validate
    open-in-view: false

toss:
  api:
    base-url: https://openapi.tossinvest.com
    # client-id / client-secret 은 application-local.yml 에만 둔다 (CLAUDE.md §1.1)

collector:
  # 요청 간 대기. 레이트리밋은 토큰 버킷이라 연속 요청이 버킷을 말린다.
  request-delay-ms: 300
  max-retries: 8
  csv-dir: ../data/samples
  # 적재 대상 db | csv | both. --target 으로 바꿀 수 있다
  target: db
  # 배치 insert 한 번에 넘길 행 수
  batch-size: 1000

marketdata:
  # db | csv. 운영은 db 다.
  # ⚠️ 임시로 csv — 토스 API 를 쓸 수 없어 DB 에 시세가 없다 (CLAUDE.md §9).
  #    DB 를 채우고 DbPriceDataProvider 를 실데이터로 검증하면 db 로 되돌린다
  provider: csv
  csv-dir: ../data/samples

room:
  # 1틱 = 1초 (CLAUDE.md §7). 테스트에서만 줄인다
  tick-millis: 1000
  # 끝난 방을 결과 조회용으로 남겨 두는 시간 (10분). M8 이 생기면 결과는 DB 에서 읽는다
  finished-retention-millis: 600000
  # 요청이 방의 실행 흐름에서 처리되기를 기다리는 최대 시간
  call-timeout-millis: 5000
  # 대기 중 연결이 끊긴 참가자를 자동 퇴장시키기까지의 유예 (15초). 그 안에 다시 접속하면 취소 (CLAUDE.md §9-9)
  disconnect-grace-millis: 15000
  # 아무 활동(입장·퇴장·준비) 없는 대기방을 닫기까지의 시간 (30분)
  waiting-timeout-millis: 1800000
  # 방 만들 때 고를 수 있는 판 길이(틱). 1틱 = 1초라 1분 / 2분 / 4분 (2026-10-03, 플레이해보며 조정)
  # 시나리오 봉 수가 「틱 + 1」 이상이어야 그 길이로 돌 수 있다. 지금 시나리오는 모두 241봉이라 240 까지
  allowed-ticks: [60, 120, 240]
  default-ticks: 240

realtime:
  # WebSocket 허용 출처. 로컬 개발 서버(P0)만 받는다. 배포할 때 다시 정한다
  allowed-origins:
    - http://localhost:*
    - http://127.0.0.1:*

logging:
  level:
    com.moneygame: INFO

---
# 임시 공개 — Cloudflare 임시 터널로 밖에서 접속하게 한다 (CLAUDE.md §4, §9-12). scripts/share.sh 가 켠다
spring:
  config:
    activate:
      on-profile: share
server:
  # 프론트(vite preview)의 프록시만 들어오게 한다. 같은 와이파이에서도 8080 에 직접 붙지 못한다
  address: 127.0.0.1
realtime:
  allowed-origins:
    - http://localhost:*
    - http://127.0.0.1:*
    - https://*.trycloudflare.com

---
# 배치형 실행 — 시세 수집(collector), 시나리오 관리(scenario).
# 작업이 끝나면 종료해야 한다. web 의존성이 들어와도 웹 서버를 띄우지 않는다 (§2.3)
spring:
  config:
    activate:
      on-profile: collector | scenario
  main:
    web-application-type: none
