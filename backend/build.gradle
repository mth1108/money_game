// 머니게임 백엔드. 하나의 애플리케이션을 프로파일로 나눠 실행한다 (CLAUDE.md §2.3).
// 새 의존성은 추가 전에 확인을 구한다 (§1.7).
// engine/ 과 position/ 은 Spring 을 import 하지 않는다 (CLAUDE.md §2.2).
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'com.moneygame'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')

    implementation 'org.springframework.boot:spring-boot-starter'
    // Jackson. 토스 API 호출 자체는 JDK 내장 HttpClient 를 쓴다 (HTTP 라이브러리 추가 없음)
    implementation 'org.springframework.boot:spring-boot-starter-json'

    // 조회는 JPA, 시세 적재는 건수가 많아 JdbcTemplate 배치 insert 로 처리한다 (§5)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // M6 방 관리 REST. 2026-09-25 승인 (§8 결정됨). collector · scenario 프로파일은 웹 서버를 띄우지 않는다
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // M7 실시간 통신. 순수 WebSocket + JSON {type, payload}. STOMP 는 쓰지 않는다. 2026-09-25 승인
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// 기본 test 는 순수 단위 테스트만 돈다. DB 가 없어도 통과해야 한다
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

// 로컬 MySQL 이 필요한 통합 테스트. application-local.yml 의 접속 정보를 쓴다
//   ./gradlew integrationTest
tasks.register('integrationTest', Test) {
    description = '로컬 MySQL 통합 테스트 (@Tag("integration"))'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
