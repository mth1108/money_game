// M1 수집기 단계.
// JPA·MySQL 은 다음 단계에서 추가한다 (DB 적재). 지금은 API -> CSV 경로만 만든다.
// engine/ 과 position/ 은 Spring 을 import 하지 않는다 (CLAUDE.md §2.2).
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'com.moneygame'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')

    implementation 'org.springframework.boot:spring-boot-starter'
    // Jackson. 토스 API 호출 자체는 JDK 내장 HttpClient 를 쓴다 (HTTP 라이브러리 추가 없음)
    implementation 'org.springframework.boot:spring-boot-starter-json'

    // 조회는 JPA, 시세 적재는 건수가 많아 JdbcTemplate 배치 insert 로 처리한다 (§5)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
